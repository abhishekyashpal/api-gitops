apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: backend-api-test
  namespace: argocd
  labels:
    app.kubernetes.io/name: backend-api
    app.kubernetes.io/environment: test

spec:
  project: default

  source:
    repoURL: https://github.com/abhishekyashpal/api-gitops.git
    targetRevision: master
    path: apps/backend-api/chart
    helm:
      releaseName: backend-api-test
      valueFiles:
        - values.yaml
        - values-test.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: backend-api-test

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false

    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
      - Validate=true
      - ServerSideApply=true

    managedNamespaceMetadata:
      labels:
        app.kubernetes.io/name: backend-api
        app.kubernetes.io/environment: test
