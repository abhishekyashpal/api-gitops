replicaCount: 1

image:
  repository: developerkingabhi/api-project
  tag: v1.0.0
  pullPolicy: IfNotPresent

podLabels:
  app.kubernetes.io/component: api
  app.kubernetes.io/part-of: backend-api
  app.kubernetes.io/environment: test

env:
  NODE_ENV: test

resources:
  requests:
    cpu: 75m
    memory: 96Mi
  limits:
    cpu: 300m
    memory: 384Mi

deployment:
  revisionHistoryLimit: 3
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts:
    - host: backend-api-test.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 4
  targetCPUUtilizationPercentage: 75
  targetMemoryUtilizationPercentage: 85

podDisruptionBudget:
  enabled: false
  minAvailable: 1

networkPolicy:
  enabled: false
  ingressNamespace: ingress-nginx

