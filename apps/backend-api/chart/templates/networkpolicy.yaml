{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "backend-api.fullname" . }}-ingress-only
  labels:
    {{- include "backend-api.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "backend-api.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressNamespace }}
      ports:
        - protocol: TCP
          port: {{ .Values.container.port }}
{{- end }}

