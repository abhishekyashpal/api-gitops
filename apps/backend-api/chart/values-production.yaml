replicaCount: 3

image:
  repository: developerkingabhi/api-project
  tag: v1.0.0
  pullPolicy: IfNotPresent

podLabels:
  app.kubernetes.io/component: api
  app.kubernetes.io/part-of: backend-api
  app.kubernetes.io/environment: production

env:
  NODE_ENV: production

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

deployment:
  revisionHistoryLimit: 10
  minReadySeconds: 15
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0

ingress:
  enabled: false
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
  hosts:
    - host: backend-api-production.local
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: backend-api-production-tls
      hosts:
        - backend-api-production.local

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 2

networkPolicy:
  enabled: true
  ingressNamespace: ingress-nginx



